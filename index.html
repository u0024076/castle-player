<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>城堡 - 動態歌詞播放器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #080c14;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* 藍色煙霧流動背景 */
    body::before, body::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.6;
      z-index: 0;
      animation: smokeMove 12s infinite alternate ease-in-out;
    }

    body::before {
      background: radial-gradient(circle, #1e3c72 0%, #2a5298 100%);
      top: 10%;
      left: 15%;
    }

    body::after {
      background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 100%);
      bottom: 10%;
      right: 15%;
      animation-delay: -6s;
    }

    @keyframes smokeMove {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 0.4;
      }
      50% {
        transform: translate(60px, 40px) scale(1.3) rotate(90deg);
        opacity: 0.7;
      }
      100% {
        transform: translate(-40px, 80px) scale(0.9) rotate(180deg);
        opacity: 0.5;
      }
    }

    /* 播放器主體卡片：帶有磨砂玻璃效果 */
    .player-card {
      position: relative;
      z-index: 1;
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 30px 20px;
      border-radius: 20px;
      border: 1px solid rgba(64, 150, 255, 0.15);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 162, 255, 0.15);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    /* 標題發光效果 */
    h2 {
      margin-bottom: 20px;
      font-weight: 500;
      letter-spacing: 3px;
      color: #ffffff;
      font-size: 1.4rem;
      text-shadow: 0 0 10px rgba(0, 195, 255, 0.6), 0 0 20px rgba(0, 140, 255, 0.4);
    }

    audio {
      width: 100%;
      margin-bottom: 25px;
      outline: none;
      border-radius: 8px;
    }

    .lyrics-container {
      height: 280px;
      overflow: hidden;
      position: relative;
      mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
    }

    #lyrics-list {
      list-style: none;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    #lyrics-list li {
      height: 40px;
      line-height: 40px;
      color: #526880;
      font-size: 0.95rem;
      transition: all 0.4s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 10px;
    }

    /* 當前歌詞：藍色閃耀霓虹發光 */
    #lyrics-list li.active {
      color: #79d7ff;
      font-size: 1.25rem;
      font-weight: 600;
      text-shadow: 
        0 0 8px rgba(121, 215, 255, 0.9),
        0 0 18px rgba(0, 153, 255, 0.7),
        0 0 30px rgba(0, 102, 255, 0.5);
    }
  </style>
</head>
<body>

  <div class="player-card">
    <audio id="audio" controls preload="auto" playsinline crossorigin="anonymous">
      <source src="castle.mp3" type="audio/mpeg">
      您的瀏覽器不支援音訊播放。
    </audio>
    
    <div class="lyrics-container">
      <ul id="lyrics-list"></ul>
    </div>
  </div>

  <script>
    const lrcData = `
[00:14.83]凌晨兩點　畫室的燈還沒熄掉
[00:18.43]菸灰落在　那張沒完成的線稿
[00:22.26]後頸那塊膠　依舊貼得很好
[00:24.49]至少沒有人　聞見鳶尾花在燃燒
[00:28.48]藍莓的菸　燒到只剩苦甜味道
[00:31.91]松節油的氣味　在窗邊繞了又繞
[00:35.26]能證明妳的 其實沒有多少
[00:38.05]一張舊照片 和不敢寄出的素描
[00:41.93]走廊盡頭 那扇門很低調
[00:46.19]鑰匙一直 被我藏在外套
[00:49.14]朋友問起 我只說堆些顏料
[00:51.94]反正說謊久了 也算一種禮貌
[00:54.17]算了
[00:54.49]妳從來不知道 才最好
[00:55.77]我把妳畫進 沒人看見的牆角
[00:59.20]一筆一筆 假裝只是線條
[01:02.87]顏料乾了 為什麼妳沒乾掉
[01:05.90]越是塗掉 輪廓越是明瞭
[01:08.85]我沒有等妳 也沒有忘掉
[01:11.64]只是沉得太深　連光都照不到
[01:16.19]如果秘密 也需要一座城堡
[01:19.94]我住裡面 就好
[01:22.50]後來有人 長著相似的眉梢
[01:34.22]我卻對她　比誰都更加煩躁
[01:44.36]她沒有做錯　其實我都知道
[01:47.63]只是她活著　這件事太像嘲笑
[01:51.06]那天白色的花　沿著長廊擺好
[01:54.09]妳的照片安靜得只剩微笑
[01:58.24]我站得很直 連眼淚都嫌吵
[02:01.35]只是鳶尾那晚 怎麼也藏不好
[02:06.14]走廊盡頭 那扇門很低調
[02:09.57]鑰匙一直 被我藏在外套
[02:11.56]後來沒人問起 我也不再提到
[02:15.87]反正沉默久了 就成了句號
[02:19.22]我把妳畫進 沒人看見的牆角
[02:22.65]一筆一筆 假裝只是線條
[02:26.01]顏料乾了 為什麼妳沒乾掉
[02:29.36]越是塗掉 輪廓越是明瞭
[02:32.39]我沒有等妳 也沒有忘掉
[02:35.58]只是沉得太深連光都照不到
[02:39.65]如果秘密 也需要一座城堡
[02:42.68]我住裡面 就好
[02:45.79]如果那一年 我沒有退得太早
[02:49.14]如果那句喜歡 不必藏得那麼好
[02:52.65]如果愛妳 不必假裝只是依靠
[02:56.56]算了
[02:57.92]妳從來不知道 才最好
[03:17.15]我還是畫妳　在沒人去的牆角
[03:20.90]只是現在　已經不用打草稿
[03:24.25]每一道陰影　我都記得剛好
[03:27.04]連妳低著眼　怎麼笑都知道
[03:30.71]我沒有愛妳　這句說得真好
[03:33.83]說了這麼多年　差點把自己騙到
[03:37.26]門鎖生鏽　鑰匙也早就丟掉
[03:40.53]就讓妳留在最乾淨的年少
[03:44.52]這座城堡
[03:47.87]我沒有出去
[03:49.62]也沒有人來找
`;

    const audio = document.getElementById('audio');
    const lyricsList = document.getElementById('lyrics-list');
    let parsedLyrics = [];

    function parseLRC(lrc) {
      const lines = lrc.trim().split('\n');
      const result = [];
      const timeExp = /\[(\d{2}):(\d{2})\.(\d{2})\]/;

      lines.forEach(line => {
        const match = timeExp.exec(line);
        if (match) {
          const m = parseInt(match[1]);
          const s = parseInt(match[2]);
          const time = m * 60 + s;
          const text = line.replace(timeExp, '').trim();
          if (text) result.push({ time, text });
        }
      });
      return result;
    }

    function render() {
      parsedLyrics = parseLRC(lrcData);
      lyricsList.innerHTML = parsedLyrics.map((item, index) => 
        `<li data-index="${index}">${item.text}</li>`
      ).join('');
    }

    render();

    audio.addEventListener('timeupdate', syncLyrics);

    function syncLyrics() {
      const currentTime = audio.currentTime;
      let activeIndex = -1;

      for (let i = 0; i < parsedLyrics.length; i++) {
        if (currentTime >= parsedLyrics[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== -1) {
        const items = lyricsList.querySelectorAll('li');
        items.forEach(item => item.classList.remove('active'));

        const activeItem = items[activeIndex];
        if (activeItem) {
          activeItem.classList.add('active');
          const containerHeight = 280;
          const offset = (activeIndex * 40) - (containerHeight / 2) + 20;
          lyricsList.style.transform = `translateY(-${Math.max(0, offset)}px)`;
        }
      }
    }
  </script>
</body>
</html>
